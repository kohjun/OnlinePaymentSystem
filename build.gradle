plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    all {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 기본 의존성
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // JSON 처리
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // HTTP 클라이언트
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'

    // Redis 관련
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'io.lettuce:lettuce-core'
    implementation 'org.apache.commons:commons-pool2'

    // Resilience4j (Spring Boot 3 대응)
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-timelimiter:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.1.0'


    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // Database and migrations
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.postgresql:postgresql'

    // Temporal workflow orchestration
    implementation 'io.temporal:temporal-spring-boot-starter:1.35.0'

    // H2 Database (테스트용 인메모리 DB)
    runtimeOnly 'com.h2database:h2'
    testImplementation 'com.h2database:h2'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'io.temporal:temporal-testing:1.35.0'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'org.testcontainers:postgresql:1.20.4'
    testImplementation 'org.testcontainers:kafka:1.20.4'
}

tasks.withType(Test).configureEach {
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration', 'toss-sandbox'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs Docker/Testcontainers-backed integration tests.'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter test
}

tasks.register('tossSandboxTest', Test) {
    useJUnitPlatform {
        includeTags 'toss-sandbox'
    }
    onlyIf {
        System.getenv('TOSS_CLIENT_KEY') && System.getenv('TOSS_SECRET_KEY')
    }
    shouldRunAfter test
}

jacoco {
    toolVersion = '0.8.12'
}

// Merges test.exec and integrationTest.exec so the compensation and concurrency
// scenarios count toward coverage, not just the mocked unit tests.
tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    executionData.setFrom(fileTree(layout.buildDirectory).include('jacoco/*.exec'))
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    classDirectories.setFrom(jacocoCoveredClasses())
}

// 래칫. 실측치(명령어 57%, 분기 44%)보다 낮게 잡아 일상적인 변경이 CI를
// 빨갛게 만들지 않게 하되, 커버리지가 눈에 띄게 내려가면 잡히도록 한다.
// 추측으로 높게 걸어 자기 저장소를 상시 빨간 상태로 두는 것이 더 나쁘다.
// 수치가 오르면 이 값도 함께 올린다.
tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    // 두 실행 데이터가 모두 나온 뒤에 판정해야 한다. 순서를 걸지 않으면
    // integrationTest보다 먼저 돌아 test.exec만 보고, 통합 테스트 몫이 빠진
    // 수치로 래칫에 걸린다. dependsOn이 아니라 mustRunAfter인 이유는
    // integrationTest가 Docker를 요구하기 때문이다. Docker 없이 단위 커버리지만
    // 확인하려는 경우까지 막을 이유는 없다.
    mustRunAfter tasks.named('test'), tasks.named('integrationTest')
    executionData.setFrom(fileTree(layout.buildDirectory).include('jacoco/*.exec'))
    classDirectories.setFrom(jacocoCoveredClasses())
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.52
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.40
            }
        }
    }
}

/**
 * 커버리지 대상 클래스. 생성 코드와 값 객체는 빼고 실제 로직만 센다.
 * lombok.config의 addLombokGeneratedAnnotation이 Lombok 생성 멤버를
 * 따로 제외해준다.
 */
def jacocoCoveredClasses() {
    return files(sourceSets.main.output.classesDirs).asFileTree.matching {
        exclude 'com/example/payment/PaymentApplication*'
        exclude 'com/example/payment/presentation/dto/**'
        exclude 'com/example/payment/domain/model/**/*Status*'
    }
}

layout.buildDirectory.set(file('build_sim_new'))

def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('frontendInstall', Exec) {
    group = 'frontend'
    description = 'Installs the EverySale marketplace frontend dependencies.'
    workingDir file('frontend')
    commandLine npmCommand, 'ci'
}

tasks.register('frontendBuild', Exec) {
    group = 'frontend'
    description = 'Builds the EverySale React marketplace into Spring static resources.'
    workingDir file('frontend')
    commandLine npmCommand, 'run', 'build'
}
