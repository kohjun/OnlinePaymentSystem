spring:
  application:
    name: payment-service-test
  jackson:
    # Jackson 3의 기본값(속성 알파벳 정렬, 원시 타입 null 거부, final 필드 미사용 등)은
    # Jackson 2와 다르다. 이미 저장된 멱등 응답·Outbox·Redis 값과 요청 지문 해시가 같은
    # 형식을 유지하도록 Boot 3 시절 기본값으로 둔다. src/test/resources/wire-format 참고.
    use-jackson2-defaults: true
    # 아래 둘은 use-jackson2-defaults가 되돌리지 않는 차이다. 기본 생성자가 없는 DTO
    # (입찰·응모 응답 등)를 Boot 3처럼 package-private 생성자와 매개변수 이름으로 읽는다.
    mapper:
      detect-parameter-names: true
    visibility:
      setter: any
      creator: any

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false

  sql:
    init:
      mode: never

  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
    scheduling:
      pool:
        size: 2

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  kafka:
    bootstrap-servers: localhost:9092
    admin:
      auto-create: false
    consumer:
      group-id: payment-events-group
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.payment: DEBUG
    org.springframework.kafka: WARN
  pattern:
    level: "%5p [tenant:%X{tenantId:-everysale-test}] [partner:%X{partnerId:-test-partner}] [corr:%X{correlationId:-n/a}]"

payment:
  processing:
    retry-count: 3
    timeout-seconds: 60
  default-gateway: MOCK_PAYMENT_GATEWAY
  allow-gateway-fallback: true
  mock:
    enabled: true
  toss:
    client-key: test_ck_placeholder
    secret-key: test_sk_placeholder
    base-url: https://api.tosspayments.com
    mode: test
    api-version: 2022-11-16
    test-code:
  topics:
    payment-requests: payment-requests
    payment-events: payment-events

app:
  audit:
    enabled: true
  checkout:
    public-complete-enabled: true
    legacy-reservation-api-enabled: true
  distribution:
    brand-name: 에브리세일
    mode: DEMO
    release-channel: test
    minimum-java-version: 17
    fail-fast-on-blockers: false
    require-real-payment-gateway: false
    require-external-auth: false
    require-tenant-isolation: false
  tenancy:
    default-tenant-id: everysale-test
    default-partner-id: test-partner
    require-tenant-header: false
    response-headers-enabled: true
  security:
    mock-auth:
      enabled: true
      default-customer-id: CUST-1049
      default-roles: CUSTOMER,ADMIN
    local-auth:
      # 테스트 전용 서명 키. 32바이트 미만이면 컨텍스트가 뜨지 않는다.
      jwt-secret: everysale-test-signing-secret-32bytes-minimum
    external-auth:
      enabled: false
  temporal:
    enabled: false
    worker-enabled: false
    target: localhost:7233
    namespace: payment
    task-queue: payment-reservation-task-queue
    start-to-close-timeout-seconds: 30
    result-wait-timeout-seconds: 5
  outbox:
    enabled: false
  kafka:
    listeners:
      payment-events:
        enabled: false
  legacy-wal:
    enabled: false

management:
  tracing:
    # 테스트는 추적을 끈다. 도달할 수 없는 OTLP 수집기로 내보내려다
    # 로그만 시끄러워지고, 검증하려는 대상도 아니다.
    export:
      enabled: false
