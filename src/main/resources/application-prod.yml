spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:50}
      minimum-idle: ${DATABASE_MIN_IDLE:5}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT_MS:5000}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}

server:
  forward-headers-strategy: native

app:
  audit:
    enabled: true
  checkout:
    public-complete-enabled: false
  auction:
    auto-close-enabled: true
  inventory:
    reconciliation:
      enabled: true
  marketplace:
    lifecycle:
      enabled: true
      fixed-delay-ms: ${MARKETPLACE_LIFECYCLE_DELAY_MS:5000}
    realtime:
      redis-broadcast-enabled: true
      heartbeat-ms: ${MARKETPLACE_SSE_HEARTBEAT_MS:15000}
      reconnect-ms: ${MARKETPLACE_SSE_RECONNECT_MS:1000}
      stream-timeout-ms: ${MARKETPLACE_SSE_TIMEOUT_MS:1800000}
  outbox:
    enabled: true
  payout:
    transfer:
      provider: ${PAYOUT_TRANSFER_PROVIDER:}
      external-adapter-enabled: ${PAYOUT_TRANSFER_ADAPTER_ENABLED:false}
      toss:
        # 수납용 TOSS_SECRET_KEY와 분리한다. 지급대행은 돈이 나가는
        # 방향이라 권한과 회전 주기를 따로 관리해야 한다.
        secret-key: ${PAYOUT_TOSS_SECRET_KEY:}
        base-url: ${PAYOUT_TOSS_BASE_URL:https://api.tosspayments.com}
        mode: ${PAYOUT_TOSS_MODE:live}
        connect-timeout-ms: ${PAYOUT_TOSS_CONNECT_TIMEOUT_MS:5000}
        read-timeout-ms: ${PAYOUT_TOSS_READ_TIMEOUT_MS:30000}
      reconciliation:
        enabled: true
        stale-seconds: ${PAYOUT_TRANSFER_STALE_SECONDS:300}
        batch-size: ${PAYOUT_TRANSFER_RECONCILIATION_BATCH_SIZE:50}
        fixed-delay-ms: ${PAYOUT_TRANSFER_RECONCILIATION_DELAY_MS:60000}
        initial-delay-ms: ${PAYOUT_TRANSFER_RECONCILIATION_INITIAL_DELAY_MS:30000}
  queue:
    enabled: true
    promote-size: ${QUEUE_PROMOTE_SIZE:50}
    max-active-users: ${QUEUE_MAX_ACTIVE_USERS:500}
    active-lease-seconds: ${QUEUE_ACTIVE_LEASE_SECONDS:60}
    promotion-fixed-delay-ms: ${QUEUE_PROMOTION_FIXED_DELAY_MS:1000}
  distribution:
    mode: PRODUCTION
    release-channel: production
    fail-fast-on-blockers: true
    require-real-payment-gateway: true
    require-external-auth: true
    require-tenant-isolation: true
  security:
    mock-auth:
      enabled: false
    local-auth:
      # 상용은 외부 IdP가 인증을 담당한다. 자체 발급 토큰과 OIDC 토큰을
      # 동시에 신뢰하면 어느 발급자가 만든 토큰인지 구분할 수 없다.
      enabled: false
    external-auth:
      enabled: true
      audience: ${OIDC_AUDIENCE}
    cors:
      enabled: true
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  tenancy:
    mode: SINGLE_TENANT
    allowed-tenant-id: ${EVERYSALE_TENANT_ID}
    database-rls-enabled: false
    require-tenant-header: false
    bind-token-claims: true
    require-token-tenant-claim: true
    require-token-partner-claim: false
    default-tenant-id: ${EVERYSALE_TENANT_ID}
    default-partner-id: ${DEFAULT_PARTNER_ID:everysale-marketplace}
  temporal:
    enabled: true
    worker-enabled: true
    target: ${TEMPORAL_TARGET}
    namespace: ${TEMPORAL_NAMESPACE:payment}
    task-queue: ${TEMPORAL_TASK_QUEUE:payment-reservation-task-queue}

payment:
  default-gateway: TOSS_PAYMENTS
  allow-gateway-fallback: false
  mock:
    enabled: false
  toss:
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
    mode: live
    api-version: ${TOSS_API_VERSION:2022-11-16}
    webhook:
      enabled: true
      path-token: ${TOSS_WEBHOOK_PATH_TOKEN}
      retry-fixed-delay-ms: ${TOSS_WEBHOOK_RETRY_FIXED_DELAY_MS:30000}
      max-retry: ${TOSS_WEBHOOK_MAX_RETRY:7}
    reconciliation:
      enabled: true
      fixed-delay-ms: ${TOSS_RECONCILIATION_FIXED_DELAY_MS:60000}
      stale-seconds: ${TOSS_RECONCILIATION_STALE_SECONDS:300}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      # 상용은 전량 수집하지 않는다. 결제 트래픽 전부에 스팬을 남기면
      # 수집기 비용과 애플리케이션 오버헤드가 모두 커진다. 장애 조사에는
      # 표본으로 충분하고, 특정 요청을 끝까지 봐야 하면 값을 올린다.
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:}
